{% extends 'base.html' %}

{% block content %}
<div style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2.5rem; border-bottom: 2px solid #f0f0f0; padding-bottom: 20px;">
        <div>
            <h1 style="margin: 0; font-size: 2rem; color: #1a1a1a;">All Crypto Predictions</h1>
            <p style="color: #666; margin-top: 5px;">Real-time global sentiment across 100+ active blockchain markets.</p>
        </div>
        <div style="display: flex; gap: 15px; align-items: center;">
            <span id="poll-count" style="background: #eef2ff; color: #4f46e5; padding: 5px 12px; border-radius: 20px; font-weight: bold; font-size: 0.85rem;">Loading...</span>
            <a href="javascript:history.back()" style="color: #4f46e5; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 5px;">
                <span style="font-size: 1.2rem;">←</span> Back to Analysis
            </a>
        </div>
    </div>

    <div id="full-poll-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 25px;">
        <p style="text-align: center; grid-column: 1 / -1; color: #999; font-style: italic; margin-top: 50px;">
            Fetching the full spectrum of crypto sentiment...
        </p>
    </div>
</div>

<script>
    function fetchAllPolls() {
        const grid = document.getElementById('full-poll-grid');
        const countBadge = document.getElementById('poll-count');
        
        // We call the 'all' endpoint which has a higher limit (set in routes.py)
        fetch('/api/all_manifold_polls')
            .then(res => res.json())
            .then(data => {
                grid.innerHTML = '';
                
                if (!data || data.length === 0) {
                    grid.innerHTML = '<p style="text-align: center; grid-column: 1 / -1; color: #999;">No active prediction markets found at this time.</p>';
                    countBadge.innerText = '0 Markets';
                    return;
                }

                countBadge.innerText = `${data.length} Live Markets`;

                data.forEach(poll => {
                    const yesPct = Math.round(poll.yes_price * 100);
                    const noPct = 100 - yesPct;
                    
                    const card = `
                        <div style="background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); position: relative; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid #f9f9f9; transition: transform 0.2s ease;">
                            <div>
                                <span style="font-size: 0.65rem; color: #4f46e5; font-weight: 800; background: #eef2ff; padding: 3px 8px; border-radius: 6px; float: right;">VOL: ${poll.volume}</span>
                                <p style="font-weight: 700; margin: 0 0 20px 0; font-size: 1.05rem; line-height: 1.5; color: #1a1a1a; padding-right: 20px;">${poll.question}</p>
                            </div>

                            <div>
                                <div style="width: 100%; height: 12px; background: #f0f0f0; border-radius: 6px; overflow: hidden; display: flex; margin-bottom: 12px;">
                                    <div style="width:
