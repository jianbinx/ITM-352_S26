{% extends 'base.html' %}

{% block content %}
<div style="margin-bottom: 2rem;">
    <h1 style="margin: 0; color: #333;">All Crypto Prediction Polls</h1>
    <p style="color: #666;">View and participate in global prediction markets powered by Manifold.</p>
</div>

<div style="background: white; padding: 1.5rem; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
    <div id="loading-polls" style="text-align: center; padding: 2rem; color: #666;">
        <p>Loading global prediction markets...</p>
    </div>
    
    <div id="polls-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; display: none;">
        <!-- Polls will be dynamically injected here by Javascript -->
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        fetch('/api/all_manifold_polls')
            .then(response => response.json())
            .then(data => {
                const loading = document.getElementById('loading-polls');
                const grid = document.getElementById('polls-grid');
                
                loading.style.display = 'none';
                grid.style.display = 'grid';
                
                if (data.length === 0) {
                    grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #888;">No polls available at the moment.</p>';
                    return;
                }
                
                data.forEach(poll => {
                    const card = document.createElement('div');
                    card.style.cssText = 'border: 1px solid #eee; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; background-color: #fafafa;';
                    
                    const yesPct = (poll.yes_price * 100).toFixed(1);
                    const noPct = (poll.no_price * 100).toFixed(1);
                    
                    card.innerHTML = `
                        <div>
                            <h4 style="margin-top: 0; margin-bottom: 10px; font-size: 1rem; color: #333;">${poll.question}</h4>
                            <p style="margin: 0 0 15px 0; font-size: 0.85rem; color: #888;">Volume: ${poll.volume}</p>
                        </div>
                        <div style="margin-top: 15px;">
                            <div style="display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.9rem;">
                                <span style="color: #28a745; font-weight: bold;">Yes: ${yesPct}%</span>
                                <span style="color: #dc3545; font-weight: bold;">No: ${noPct}%</span>
                            </div>
                            <div style="width: 100%; background-color: #ffeeba; border-radius: 4px; overflow: hidden; display: flex; height: 8px;">
                                <div style="width: ${yesPct}%; background-color: #28a745;"></div>
                                <div style="width: ${noPct}%; background-color: #dc3545;"></div>
                            </div>
                            <a href="${poll.url || '#'}" target="_blank" style="display: block; text-align: center; margin-top: 15px; padding: 8px; background-color: #6f42c1; color: white; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 0.9rem; transition: 0.3s;">Vote on Manifold &rarr;</a>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            })
            .catch(err => {
                console.error('Error fetching polls:', err);
                document.getElementById('loading-polls').innerHTML = '<p style="color: red;">Failed to load polls. Please try again later.</p>';
            });
    });
</script>
{% endblock %}
